repos:
  - repo: local
    hooks:
      - id: cl-indentify
        name: cl-indentify (scheme formatter)
        entry: ./scripts/format-scheme
        language: system
        files: '\.scm$'
        exclude: '^src/geasa/.*/manifest\.scm$'
      - id: update-version
        name: update VERSION via git-cliff
        entry: ./scripts/update-version
        language: system
        always_run: true
        pass_filenames: false
